<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/digest.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="每日精选 RSS" href="{{ '/feed.xml' | relative_url }}">
  <script src="{{ '/assets/js/digest.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">每日精选<span>DAILY BRIEF</span></a>
    <nav aria-label="网站导航"><a href="{{ '/' | relative_url }}">日报归档</a><a href="{{ '/feed.xml' | relative_url }}">订阅 RSS</a></nav>
  </header>
  <div class="reading-layout">
    <main id="main" class="main-content" tabindex="-1">{% include report-content.html %}</main>
  </div>
  <footer class="site-footer">有来源，有判断，留有边界。<a href="#main">回到顶部 ↑</a></footer>
</body>
</html>
